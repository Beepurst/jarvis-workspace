<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilan mensuel Suivi avis</title>
<!--
  Bilan mensuel du Suivi avis, une page A4.
  Ne pas remplir ce fichier à la main pour un client : le copier en bilan-<client>-<aaaa-mm>.html
  dans livrables/clients/<client>/, puis remplir uniquement l'objet BILAN ci-dessous (voir README.md).
  n8n remplira le même objet (voir README.md, partie « Automatisation »).
  Les chiffres ci-dessous sont FICTIFS (client test Garnier Plomberie) : exemple: true affiche le bandeau.
-->
<script>
const BILAN = {
  exemple: true,
  client: "Garnier Plomberie",
  mois: "octobre 2026",
  moisPrecedent: "septembre",
  // null pour une donnée absente : la case affiche « non mesuré » au lieu d'un faux zéro.
  avis: {
    recus: 6, recusAvant: 3,
    note: 4.8, noteAvant: 4.7,       // note moyenne de la fiche, tous avis confondus, en fin de mois
    total: 41,
    repondus: 6,                     // réponses publiées aux avis reçus dans le mois
    historique: [                    // avis reçus par mois, 6 derniers mois, le mois du bilan en dernier
      { mois: "mai", n: 1 }, { mois: "juin", n: 2 }, { mois: "juil.", n: 1 },
      { mois: "août", n: 2 }, { mois: "sept.", n: 3 }, { mois: "oct.", n: 6 },
    ],
    extraits: [                      // 2 avis du mois au plus, coupés à 140 signes
      { auteur: "Sophie L.", note: 5, texte: "Fuite sous l'évier réparée le jour même, devis clair et respecté. Je garde le numéro." },
      { auteur: "Karim B.", note: 4, texte: "Bon travail sur le chauffe-eau, un peu de retard à l'arrivée mais il avait prévenu." },
    ],
  },
  fiche: {
    vues: 1840, vuesAvant: 1610,     // vues de la fiche sur Google Search et Maps
    appels: 23, appelsAvant: 17,
    itineraires: 14, itinerairesAvant: 12,
    clicsSite: 31, clicsSiteAvant: 26,
    publications: 3,
  },
  site: {
    visites: 412, visitesAvant: 365,
    demandes: { formulaire: 7, telephone: 9, whatsapp: 2 }, // contacts envoyés depuis le site
    demandesAvant: 13,
    google: { clics: 168, clicsAvant: 141, impressions: 5210 },
    recherches: [                    // Search Console, 5 premières requêtes par clics
      { q: "plombier cergy", clics: 42 },
      { q: "garnier plomberie", clics: 31 },
      { q: "fuite chauffe-eau cergy", clics: 9 },
      { q: "plombier pontoise", clics: 7 },
      { q: "débouchage canalisation cergy", clics: 5 },
    ],
  },
  lienAvis: "g.page/r/XXXXXXXXXXXX/review",
  dateDonnees: "31 octobre 2026",
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700&display=block">
<style>
  @page { size: A4; margin: 0; }
  :root {
    --fond: #F4F1EA; --carte: #FFFFFF; --sombre: #1A1A17;
    --second: rgba(26,26,23,.62); --filet: rgba(26,26,23,.10);
    --accent: #C9A46A; --hausse: #2F6B3F; --baisse: #9A3B2E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--fond); color: var(--sombre); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font: 400 8.6pt/1.42 Inter, system-ui, sans-serif; }
  .page { width: 210mm; height: 297mm; padding: 13mm 13mm 10mm; display: flex; flex-direction: column; gap: 4.2mm; overflow: hidden; position: relative; }
  .titre { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 700; letter-spacing: -.03em; }

  .exemple { position: absolute; top: 0; left: 0; right: 0; background: var(--sombre); color: #fff; text-align: center; font: 500 7.5pt/1 Inter, sans-serif; padding: 2mm 0; letter-spacing: .02em; }
  .exemple + .entete { margin-top: 3mm; }

  .entete { display: flex; justify-content: space-between; align-items: flex-end; }
  .marque { font: 700 11pt/1 "Plus Jakarta Sans", sans-serif; letter-spacing: -.02em; }
  .marque span { color: var(--second); font: 500 7.5pt/1 Inter, sans-serif; letter-spacing: 0; margin-left: 2mm; }
  .periode { font-size: 8pt; color: var(--second); text-align: right; }
  h1 { font-size: 24pt; line-height: 1.05; margin-top: 1mm; }
  h1 small { display: block; font: 500 9pt/1.3 Inter, sans-serif; color: var(--second); letter-spacing: 0; margin-top: 1.6mm; }

  .resume { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; }
  .resume .case { background: var(--sombre); color: #fff; border-radius: 3.5mm; padding: 4.5mm 5mm; }
  .resume .chiffre { font: 700 26pt/1 "Plus Jakarta Sans", sans-serif; letter-spacing: -.03em; }
  .resume .libelle { margin-top: 1.8mm; font-weight: 500; }
  .resume .avant { margin-top: .8mm; font-size: 7.5pt; color: rgba(255,255,255,.62); }

  .bloc { background: var(--carte); border-radius: 3.5mm; padding: 5mm; }
  .bloc h2 { font-size: 12pt; line-height: 1.1; display: flex; justify-content: space-between; align-items: baseline; }
  .bloc h2 small { font: 400 7.5pt/1 Inter, sans-serif; color: var(--second); letter-spacing: 0; }
  .etiquette { font-size: 7.5pt; color: var(--second); margin-bottom: 1mm; }

  .avis { display: grid; grid-template-columns: 38mm 1fr 1fr; gap: 5mm; margin-top: 3.5mm; align-items: start; }
  .note { font: 700 30pt/1 "Plus Jakarta Sans", sans-serif; letter-spacing: -.03em; }
  .note span { font-size: 11pt; color: var(--second); letter-spacing: 0; }
  .etoiles { display: flex; gap: .8mm; margin: 1.6mm 0 2mm; }
  .etoiles svg { width: 3.4mm; height: 3.4mm; }
  .detail { font-size: 7.8pt; color: var(--second); }
  .detail b { color: var(--sombre); font-weight: 600; }
  .barres { display: flex; align-items: flex-end; gap: 2.2mm; height: 24mm; border-bottom: .2mm solid var(--filet); }
  .barres div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 7pt; font-weight: 600; }
  .barres i { display: block; width: 100%; background: var(--accent); border-radius: 1mm 1mm 0 0; margin-top: .8mm; opacity: .45; }
  .barres div:last-child i { opacity: 1; }
  .mois { display: flex; gap: 2.2mm; margin-top: 1mm; }
  .mois span { flex: 1; text-align: center; font-size: 6.8pt; color: var(--second); }
  .extrait { border-left: .6mm solid var(--accent); padding-left: 2.6mm; margin-bottom: 2.6mm; font-size: 7.8pt; }
  .extrait:last-child { margin-bottom: 0; }
  .extrait em { display: block; font-style: normal; color: var(--second); font-size: 7pt; margin-top: .6mm; }

  .tuiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3mm; margin-top: 3.5mm; }
  .tuile { background: var(--fond); border-radius: 2.5mm; padding: 3.2mm 3.5mm; }
  .tuile .valeur { font: 700 15pt/1 "Plus Jakarta Sans", sans-serif; letter-spacing: -.02em; margin-top: .6mm; }
  .tuile .ecart { font-size: 7pt; margin-top: 1.2mm; color: var(--second); }
  .hausse { color: var(--hausse); font-weight: 600; }
  .baisse { color: var(--baisse); font-weight: 600; }
  .absent { font: 500 9pt/1.2 Inter, sans-serif; color: var(--second); }
  .pied-bloc { margin-top: 3mm; font-size: 7.8pt; color: var(--second); }
  .pied-bloc b { color: var(--sombre); font-weight: 600; }

  .site { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; margin-top: 3.5mm; }
  .site .tuiles { grid-template-columns: 1fr 1fr; margin-top: 0; }
  .requetes { background: var(--fond); border-radius: 2.5mm; padding: 3.2mm 3.5mm; }
  .requetes table { width: 100%; border-collapse: collapse; margin-top: 1.2mm; font-size: 7.8pt; }
  .requetes td { padding: .9mm 0; border-top: .2mm solid var(--filet); }
  .requetes td:last-child { text-align: right; font-weight: 600; white-space: nowrap; }

  .rappel { background: var(--sombre); color: #fff; border-radius: 3.5mm; padding: 4.5mm 5mm; display: grid; grid-template-columns: 1fr auto; gap: 5mm; align-items: center; }
  .rappel h2 { font-size: 11pt; line-height: 1.15; }
  .rappel p { margin-top: 1.2mm; color: rgba(255,255,255,.72); font-size: 7.8pt; }
  .rappel .lien { font: 500 7.8pt/1.3 Inter, sans-serif; background: rgba(255,255,255,.1); border-radius: 10mm; padding: 2mm 3.5mm; white-space: nowrap; }

  .sources { margin-top: auto; font-size: 6.6pt; line-height: 1.45; color: var(--second); border-top: .2mm solid var(--filet); padding-top: 2.4mm; }
</style>
</head>
<body>
<div class="page" id="page"></div>
<script>
  const B = BILAN;
  const nb = (v) => (v == null ? null : v.toLocaleString("fr-FR"));
  const virgule = (v) => v.toLocaleString("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  // Écart au mois précédent : couleur seulement pour le sens, la valeur précédente reste écrite.
  function ecart(v, avant, decimale) {
    if (v == null || avant == null) return "";
    const d = Math.round((v - avant) * 10) / 10;
    const txt = decimale ? virgule(avant) : nb(avant);
    if (d === 0) return `${B.moisPrecedent} : ${txt}, stable`;
    const cls = d > 0 ? "hausse" : "baisse";
    const signe = d > 0 ? "+" : "−";
    const val = decimale ? virgule(Math.abs(d)) : nb(Math.abs(d));
    return `<span class="${cls}">${signe}${val}</span> · ${B.moisPrecedent} : ${txt}`;
  }

  function tuile(libelle, v, avant) {
    const valeur = v == null ? `<div class="absent">non mesuré</div>` : `<div class="valeur">${nb(v)}</div>`;
    return `<div class="tuile"><div class="etiquette">${libelle}</div>${valeur}<div class="ecart">${ecart(v, avant)}</div></div>`;
  }

  function etoiles(note) {
    let h = "";
    for (let i = 1; i <= 5; i++) {
      const plein = Math.max(0, Math.min(1, note - (i - 1)));
      const id = `e${i}${String(note).replace(".", "")}${Math.random().toString(36).slice(2, 6)}`;
      h += `<svg viewBox="0 0 24 24"><defs><linearGradient id="${id}"><stop offset="${plein * 100}%" stop-color="var(--accent)"/><stop offset="${plein * 100}%" stop-color="var(--filet)"/></linearGradient></defs><path fill="url(#${id})" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>`;
    }
    return `<div class="etoiles">${h}</div>`;
  }

  const a = B.avis, f = B.fiche, s = B.site;
  const demandes = s.demandes ? Object.values(s.demandes).reduce((t, n) => t + n, 0) : null;
  const max = Math.max(1, ...a.historique.map((m) => m.n));
  const partDemandes = s.demandes
    ? [["formulaire", "formulaire"], ["telephone", "appel"], ["whatsapp", "WhatsApp"]]
        .filter(([k]) => s.demandes[k]).map(([k, l]) => `${s.demandes[k]} par ${l}`).join(", ")
    : "";

  document.getElementById("page").innerHTML = `
    ${B.exemple ? `<div class="exemple">EXEMPLE · entreprise et chiffres fictifs</div>` : ""}
    <div class="entete">
      <div>
        <div class="marque">Kleak<span>Suivi avis</span></div>
        <h1 class="titre">${esc(B.client)}<small>Bilan de ${esc(B.mois)}</small></h1>
      </div>
      <div class="periode">Données arrêtées au ${esc(B.dateDonnees)}</div>
    </div>

    <div class="resume">
      <div class="case"><div class="chiffre">${nb(a.recus)}</div><div class="libelle">nouveaux avis Google</div><div class="avant">${a.recusAvant == null ? "" : `${B.moisPrecedent} : ${nb(a.recusAvant)}`}</div></div>
      <div class="case"><div class="chiffre">${f.appels == null ? "–" : nb(f.appels)}</div><div class="libelle">appels depuis votre fiche Google</div><div class="avant">${f.appelsAvant == null ? "" : `${B.moisPrecedent} : ${nb(f.appelsAvant)}`}</div></div>
      <div class="case"><div class="chiffre">${demandes == null ? "–" : nb(demandes)}</div><div class="libelle">demandes venues du site</div><div class="avant">${s.demandesAvant == null ? "" : `${B.moisPrecedent} : ${nb(s.demandesAvant)}`}</div></div>
    </div>

    <div class="bloc">
      <h2 class="titre">Vos avis Google <small>${a.recus ? `${a.repondus} réponse${a.repondus > 1 ? "s" : ""} publiée${a.repondus > 1 ? "s" : ""} sur ${a.recus} avis reçu${a.recus > 1 ? "s" : ""}` : ""}</small></h2>
      <div class="avis">
        <div>
          <div class="etiquette">Note moyenne</div>
          ${a.note == null ? `<div class="absent">pas encore d'avis</div>` : `
          <div class="note">${virgule(a.note)}<span> / 5</span></div>
          ${etoiles(a.note)}
          <div class="detail"><b>${nb(a.total)} avis</b> au total<br>${ecart(a.note, a.noteAvant, true)}</div>`}
        </div>
        <div>
          <div class="etiquette">Avis reçus par mois</div>
          <div class="barres">${a.historique.map((m) => `<div>${m.n}<i style="height:${(m.n / max) * 78}%"></i></div>`).join("")}</div>
          <div class="mois">${a.historique.map((m) => `<span>${esc(m.mois)}</span>`).join("")}</div>
        </div>
        <div>
          <div class="etiquette">Reçus ce mois-ci</div>
          ${a.extraits.length ? a.extraits.map((e) => `<div class="extrait">${esc(e.texte)}<em>${esc(e.auteur)} · ${e.note}/5</em></div>`).join("") : `<div class="detail">Aucun avis ce mois-ci.</div>`}
        </div>
      </div>
    </div>

    <div class="bloc">
      <h2 class="titre">Votre fiche Google <small>Recherche Google et Google Maps</small></h2>
      <div class="tuiles">
        ${tuile("Vues de la fiche", f.vues, f.vuesAvant)}
        ${tuile("Appels", f.appels, f.appelsAvant)}
        ${tuile("Itinéraires demandés", f.itineraires, f.itinerairesAvant)}
        ${tuile("Clics vers le site", f.clicsSite, f.clicsSiteAvant)}
      </div>
      <div class="pied-bloc"><b>${f.publications} publication${f.publications > 1 ? "s" : ""}</b> sur votre fiche ce mois-ci, à partir de vos photos de chantier.</div>
    </div>

    <div class="bloc">
      <h2 class="titre">Votre site <small>${partDemandes}</small></h2>
      <div class="site">
        <div class="tuiles">
          ${tuile("Visites", s.visites, s.visitesAvant)}
          ${tuile("Demandes de contact", demandes, s.demandesAvant)}
          ${tuile("Arrivées depuis Google", s.google ? s.google.clics : null, s.google ? s.google.clicsAvant : null)}
          ${tuile("Affichages dans Google", s.google ? s.google.impressions : null, null)}
        </div>
        <div class="requetes">
          <div class="etiquette">Ce que les gens ont tapé dans Google avant de venir</div>
          ${s.recherches && s.recherches.length
            ? `<table>${s.recherches.map((r) => `<tr><td>${esc(r.q)}</td><td>${nb(r.clics)} visite${r.clics > 1 ? "s" : ""}</td></tr>`).join("")}</table>`
            : `<div class="detail" style="margin-top:1.2mm">Pas encore assez de recherches pour en tirer une liste.</div>`}
        </div>
      </div>
    </div>

    <div class="rappel">
      <div>
        <h2 class="titre">Ce mois-ci, demandez un avis à chacun de vos clients</h2>
        <p>Le jour même ou le lendemain du chantier, avec le message et le QR code de votre kit. Une relance au bout d'une semaine si rien n'est venu, pas plus.</p>
      </div>
      <div class="lien">${esc(B.lienAvis)}</div>
    </div>

    <div class="sources">
      Sources : avis et fiche, Google Business Profile ; visites et demandes, Google Analytics ; recherches, Google Search Console.
      Les visites et les demandes ne comptent que les visiteurs qui ont accepté les cookies de mesure : les chiffres réels sont plus hauts.
      Les appels comptés sont des appuis sur le bouton Appeler de la fiche ou sur le numéro du site, pas des appels décrochés. Google publie les chiffres de la fiche avec quelques jours de retard.
    </div>
  `;
</script>
</body>
</html>
